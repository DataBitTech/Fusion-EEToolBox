<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">

  <!-- Circuit board green background -->
  <rect x="0" y="0" width="32" height="32" fill="#2e7d32"/>

  <!-- Golden pads -->
  <rect x="2" y="2" width="14" height="10" rx="1" fill="#d4af37"/>
  <rect x="16" y="20" width="14" height="10" rx="1" fill="#d4af37"/>

  <!-- Chip body -->
  <rect x="11" y="4" width="10" height="24" rx="1.5" fill="#1c1c1c"/>

  <!-- White legs landing on pads -->
  <!-- Upper-left leg -->
  <rect x="6" y="5" width="5" height="4" fill="#bfbfbf"/>

  <!-- Lower-right leg -->
  <rect x="21" y="23" width="5" height="4" fill="#bfbfbf"/>

</svg>