      <path d="M0,0 L2,1 L0,2 Z" fill="#5bab0a" />
    </marker>

    <g id="ic-chip">
      <rect x="-2" y="-4" width="4" height="7" rx="1" fill="#37474F" />
      <rect x="-4" y="-3" width="2" height="1" fill="#B0BEC5" />
      <rect x="-4" y="1" width="2" height="1" fill="#B0BEC5" />
      <rect x="-4" y="-1" width="2" height="1" fill="#B0BEC5" />
      <rect x="2" y="-3" width="2" height="1" fill="#B0BEC5" />
      <rect x="2" y="-1" width="2" height="1" fill="#B0BEC5" />
      <rect x="2" y="1" width="2" height="1" fill="#B0BEC5" />
    </g>
  </defs>

  <use href="#ic-chip" x="12" y="13" />

  <g transform="translate(4, 4.5) rotate(90)">
    <use href="#ic-chip" x="0" y="0" />
  </g>
  <path d="M 8,3 Q 12,3 12,8" stroke="#5bab0a" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-linecap="round" />
  <path d="M 7,14 Q 4,14 4,10" stroke="#5bab0a" stroke-width="1" fill="none" marker-end="url(#arrowhead)" stroke-linecap="round" />
