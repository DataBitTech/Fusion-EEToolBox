<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Curved line -->
  <path d="M0 8 H 7 L 16 -2" stroke="#73C5FF" stroke-width="2" fill="none"/>

  <!-- Green rings along the line -->
  <circle cx="5" cy="3" r="2.5" fill="green"/>
  <circle cx="3" cy="13" r="2.5" fill="green"/>
  <circle cx="13" cy="9" r="2.5" fill="green"/>
  
  <!-- Black circles in the middle -->
  <circle cx="5" cy="3" r="1" fill="black"/>
  <circle cx="3" cy="13" r="1" fill="black"/>
  <circle cx="13" cy="9" r="1" fill="black"/>
</svg>