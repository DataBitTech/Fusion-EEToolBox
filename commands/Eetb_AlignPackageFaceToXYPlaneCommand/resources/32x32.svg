<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Green flat surface (smaller, perspective view only) -->
  <polygon points="8,20 0,32 32,32 24,20" fill="#2e7d32"/>

  <!-- IC package (upright, no perspective, 6 pins total) -->
  <g transform="translate(16,15)">
    <!-- IC body -->
    <rect x="-8" y="-14" width="16" height="24" rx="1" fill="#2b2b2b"/>

    <!-- Pins left (3) -->
    <g fill="#c0c0c0">
      <rect x="-12" y="-12" width="4" height="4"/>
      <rect x="-12" y="-4"  width="4" height="4"/>
      <rect x="-12" y="4"  width="4" height="4"/>
    </g>

    <!-- Pins right (3) -->
    <g fill="#c0c0c0">
      <rect x="8" y="-12" width="4" height="4"/>
      <rect x="8" y="-4"  width="4" height="4"/>
      <rect x="8" y="4"  width="4" height="4"/>
    </g>

    <!-- Top marking -->
    <rect x="-3" y="-5" width="6" height="12" rx="0.24" fill="#555"/>

    <!-- Orientation notch -->
    <circle cx="-4" cy="-9" r="2" fill="#777"/>
  </g>
</svg>