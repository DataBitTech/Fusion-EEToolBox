<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Green flat surface (smallest, perspective view only) -->
  <polygon points="4,10 0,16 16,16 12,10" fill="#2e7d32"/>

  <!-- IC package (upright, no perspective, 6 pins total) -->
  <g transform="translate(8,7.2)">
    <!-- IC body -->
    <rect x="-4" y="-7" width="8" height="12" rx="1" fill="#2b2b2b"/>

    <!-- Pins left (3) -->
    <g fill="#c0c0c0">
      <rect x="-6" y="-6" width="2" height="2"/>
      <rect x="-6" y="-2"  width="2" height="2"/>
      <rect x="-6" y="2"  width="2" height="2"/>
    </g>

    <!-- Pins right (3) -->
    <g fill="#c0c0c0">
      <rect x="4" y="-6" width="2" height="2"/>
      <rect x="4" y="-2"  width="2" height="2"/>
      <rect x="4" y="2"  width="2" height="2"/>
    </g>

    <!-- Top marking -->
    <rect x="-2" y="-5" width="4" height="8" rx="0.5" fill="#555"/>
  </g>
</svg>