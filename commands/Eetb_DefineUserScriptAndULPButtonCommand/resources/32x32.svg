<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <g font-family="Arial, sans-serif" font-size="24" fill="white">
    <!-- Opening bracket -->
    <text x="2" y="22">[</text>
    <!-- Closing bracket -->
    <text x="23" y="22">]</text>
  </g>


  <g font-family="Consolas" font-size="10" fill="white">
    <!-- "usr" on first row -->
    <text x="8" y="14">usr</text>
    <!-- "def" on second row -->
    <text x="8" y="23">def</text>
  </g>
</svg>