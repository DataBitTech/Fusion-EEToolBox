<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- Oscilloscope (back left, white body) -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#ffffff" stroke="#2e3b4e" stroke-width="2"/>
    <rect x="16" y="14" width="188" height="96" rx="6" fill="#071e2b"/>
    <path d="M26 60 C46 30 80 100 104 60 C128 20 160 110 190 32"
          stroke="#a6ffcb" stroke-width="4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="120" r="10" fill="#1b2836"/>
    <rect x="60" y="112" width="28" height="16" rx="3" fill="#1b2836"/>
    <rect x="96" y="112" width="28" height="16" rx="3" fill="#1b2836"/>
    <rect x="132" y="112" width="28" height="16" rx="3" fill="#1b2836"/>
  </g>

  <!-- Soldering station (back right, light blue) -->
  <g transform="translate(250,120)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#87cefa"/>
    <rect x="10" y="10" width="120" height="32" rx="5" fill="#63b3e4"/>
    <rect x="20" y="16" width="46" height="20" rx="3" fill="#011524"/>
    <text x="43" y="30" font-family="monospace" font-size="12" fill="#aee6ff" text-anchor="middle">350</text>
    <circle cx="110" cy="26" r="10" fill="#37474f"/>
    <rect x="107" y="18" width="6" height="10" rx="1" fill="#ffcc80"/>
    <rect x="12" y="48" width="64" height="36" rx="4" fill="#63b3e4"/>
    <path d="M20 56 q26 16 44 0" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M110 26 C140 46 160 86 170 90" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

    <!-- Power supply (front right of multimeter, larger) -->
  <g transform="translate(210,230) scale(1.5)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="#d1d1d1" stroke="#888" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="30" rx="5" fill="#a3a3a3"/>
    <text x="60" y="30" font-family="monospace" font-size="12" fill="#111" text-anchor="middle">PSU</text>
    <rect x="20" y="50" width="30" height="20" rx="3" fill="#111"/>
    <rect x="70" y="50" width="30" height="20" rx="3" fill="#111"/>
    <circle cx="35" cy="60" r="5" fill="#f44336"/>
    <circle cx="85" cy="60" r="5" fill="#4caf50"/>
  </g>

  <!-- Multimeter (front left, slightly up to overlap bottom of scope) -->
  <g transform="translate(80,190)">
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#e87a00"/>
    <rect x="10" y="10" width="120" height="80" rx="8" fill="#0c0c11"/>
    <rect x="18" y="18" width="104" height="64" rx="6" fill="#e9f8ff" opacity="0.06"/>
    <text x="70" y="50" font-family="monospace" font-size="26" fill="#b3e5fc" text-anchor="middle">12.34</text>
    <rect x="28" y="66" width="84" height="8" rx="4" fill="#071e2b"/>
    <rect x="28" y="66" width="46" height="8" rx="4" fill="#54e0b4"/>
    <circle cx="70" cy="140" r="40" fill="#2e2e2e"/>
    <rect x="69" y="100" width="2" height="26" rx="1" fill="#f2a900"/>
    <rect x="16" y="178" width="108" height="34" rx="6" fill="#2a2a2a"/>
    <circle cx="36" cy="188" r="7" fill="#c62828"/>
    <circle cx="100" cy="188" r="7" fill="#0b5fa8"/>
    <path d="M36 188 C10 220 40 260 18 280" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M100 188 C140 230 100 260 140 280" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-2" y="278" width="10" height="22" rx="3" fill="#c62828" transform="translate(18,0)"/>
    <rect x="-2" y="278" width="10" height="22" rx="3" fill="#0b5fa8" transform="translate(140,0)"/>
  </g>

</svg>
