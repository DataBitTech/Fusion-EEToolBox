<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Swap signal routings</title>
    <link rel="stylesheet" type="text/css" href="../../../lib/eetbUtils/CSS/eetb_common.css">
    <link rel="stylesheet" type="text/css" href="../../../lib/eetbUtils/CSS/eetb_autocomplete.css">
    <link rel="stylesheet" type="text/css" href="../../../lib/eetbUtils/CSS/eetb_layer_list.css">
    <link rel="stylesheet" type="text/css" href="../../../lib/eetbUtils/CSS/eetb_option_icon.css">
    <!-- Include the generated JS enum -->
    <script type="module" src="../../../lib/eetbUtils/javascript/eetb_common.js"></script>
    <style>

    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const input1 = document.getElementById("input1");
            const input2 = document.getElementById("input2");
            const inputFields = [input1, input2];

            eetb_textFields_attachAutoComplete(inputFields, signalList);
            document.getElementById('swap-none').classList.add('selected'); // Set default selection

            // Attach event listeners to input fields for validation
            input1.addEventListener("input", validateInput);
            input2.addEventListener("input", validateInput);
            validateInput();
        });

        function validateInput() {
            const input1 = document.getElementById("input1");
            const input2 = document.getElementById("input2");
            const okButton = document.getElementById("ok-button");
            const inputValue1 = input1.value.trim().toUpperCase();
            const inputValue2 = input2.value.trim().toUpperCase();
            let valid = true;

            if (signalList.includes(inputValue1)) {
                input1.classList.remove("invalid");
            } else {
                input1.classList.add("invalid");
                valid = false;
            }

            if (signalList.includes(inputValue2)) {
                input2.classList.remove("invalid");
            } else {
                input2.classList.add("invalid");
                valid = false;
            }

            okButton.disabled = !valid;
        }

        function selectViaSwap(option, element) {
            document.getElementById('via-swap-selector').value = option;

            // Update visual selection
            document.querySelectorAll('.option-icon').forEach(img => {
                img.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        function onOkButton() {
            const input1 = document.getElementById("input1").value;
            const input2 = document.getElementById("input2").value;
            const selectedLayers = eetb_layerList_getSelectedLayerNumbers(document.getElementById('layer-list-container'));
            const viaSwapSelection = document.getElementById("via-swap-selector").value;

            const jsonData = JSON.stringify({
                'signals_to_swap': [input1, input2],
                'selected_layers': selectedLayers,
                'via_swap_option': viaSwapSelection
            });
            //adsk.fusionSendData('getTheme', '{}');
            adsk.fusionSendData('okButtonClicked', jsonData);
        }

        window.fusionJavaScriptHandler = {
            handle: function (action, data) {
                try {
                    if (action === 'setTheme') {
                        document.body.className = data.includes('Dark') ? 'dark-theme' : 'light-theme';
                    } else if (action == 'setEagleData') {
                        eetb_EagleData_processJson(data);
                        const signalLayers = layerData.filter(layer => layer.number < 17 || layer.number > 256);
                        eetb_layerList_populate(document.getElementById('layer-list-container'), signalLayers);

                        // Fill input fields if signalSelection has elements
                        if (signalSelection.length > 0) {
                            document.getElementById("input1").value = signalSelection[0];
                        }
                        if (signalSelection.length > 1) {
                            document.getElementById("input2").value = signalSelection[1];
                        }

                        // do an input validation
                        validateInput();
                    }
                } catch (e) {
                    displayError(e.toString())
                }
                return "OK";
            },
        }
        function displayError(error_string)
        {
            const errorDiv = document.getElementById('errorDisplay');
            if (errorDiv) {
                errorDiv.textContent = error_string;
                errorDiv.style.display = 'block'; // Make sure it's visible
            }
        }
    </script>
</head>
<body>
<form onsubmit="return false;">
    <table class="form-layout">
        <tbody>
            <tr>
                <td><label for="input1">Signal A</label></td>
                <td><input type="text" id="input1" name="input1" /></td>
            </tr>
            <tr>
                <td><label for="input2">Signal B</label></td>
                <td><input type="text" id="input2" name="input2" /></td>
            </tr>
            <tr>
                <td><label>On layers</label>
                <td>
                    <fieldset id="layer-selection">
                        
                        <div id="layer-list-container" class="layer-list-container">
                            <!-- Layer checkboxes will be dynamically inserted here -->
                        </div>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td><label>Via swap</label></td>
                <td>
                    <div class="option-icon-group">
                        <img src="swap_none.png" id="swap-none" class="option-icon" alt="None" title="Do not swap vias" onclick="selectViaSwap('none', this)">
                        <img src="swap_connected.png" id="swap-connected" class="option-icon" alt="Connected" title="Swap only vias connected to the swapped signal segments" onclick="selectViaSwap('connected', this)">
                        <img src="swap_all.png" id="swap-all" class="option-icon" alt="All" title="Swap all vias on the same net" onclick="selectViaSwap('all', this)">
                    </div>
                    <input type="hidden" id="via-swap-selector" value="none">
                </td>
            </tr>
        </tbody>
    </table>
    <div id="errorDisplay" class="error-message"></div> <!-- New error display div -->
    <div class="button-group">
        <button type="button" id="ok-button" onclick="onOkButton()" class="secondary">OK</button>
        <button type="button" onclick="eetb_onCancelButton()" class="secondary">Cancel</button>
    </div>
</form>
</body>
</html>
