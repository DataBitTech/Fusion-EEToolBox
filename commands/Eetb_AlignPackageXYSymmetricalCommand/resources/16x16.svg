<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">

  <!-- Circuit board green background -->
  <rect x="0" y="0" width="16" height="16" fill="#2e7d32"/>

  <!-- Golden pads -->
  <rect x="1" y="1" width="7" height="6" rx="1" fill="#d4af37"/>
  <rect x="8" y="9" width="7" height="6" rx="1" fill="#d4af37"/>

  <!-- Chip body -->
  <rect x="6" y="2" width="4" height="12" rx="1" fill="#1c1c1c"/>

  <!-- White legs landing on pads -->
  <!-- Upper-left leg -->
  <rect x="3" y="3" width="3" height="2" fill="#ffffff"/>

  <!-- Lower-right leg -->
  <rect x="10" y="11" width="3" height="2" fill="#ffffff"/>

</svg>